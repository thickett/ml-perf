[project]
name = "ml-perf"
version = "0.1.0"
description = "Small, reproducible GPU performance benchmarks with saved results and plots."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "torch>=2.14.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E402",  # matplotlib.use("Agg") must run before pyplot is imported
    "B905",  # zip(strict=) is noise here; lengths match by construction
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
